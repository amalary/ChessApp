apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: chess-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: "10"
        run.googleapis.com/cloudsql-instances: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
    spec:
      serviceAccountName: chessapp-backend-sa@PROJECT_ID.iam.gserviceaccount.com
      containerConcurrency: 20
      timeoutSeconds: 60
      containers:
        - image: REGION-docker.pkg.dev/PROJECT_ID/chessapp/backend:latest
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: APP_ENV
              value: production
            - name: CORS_ALLOWED_ORIGINS
              value: https://FRONTEND_DOMAIN
            - name: ALLOW_AUTH_DEBUG_CONFIG
              value: "false"
            - name: DB_USER
              value: app_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chess-db-pass
                  key: latest
            - name: DB_NAME
              value: chessapp
            - name: CLOUD_SQL_CONNECTION_NAME
              value: PROJECT_ID:REGION:CLOUD_SQL_INSTANCE
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
            - name: GEMINI_MODEL
              value: gemini-2.5-flash
            - name: GEMINI_TRANSCRIBE_ATTEMPTS
              value: "7"
            - name: GEMINI_MAX_ATTEMPTS_HARD_CAP
              value: "7"
            - name: GEMINI_MIN_CONSENSUS_VOTES
              value: "2"
            - name: GEMINI_CONSENSUS_EXIT_VOTES
              value: "3"
            - name: GEMINI_IMAGE_MIN_DIMENSION
              value: "1400"
            - name: GEMINI_IMAGE_MAX_DIMENSION
              value: "2200"
            - name: AUTH0_DOMAIN
              valueFrom:
                secretKeyRef:
                  name: chessapp-auth0-domain
                  key: latest
            - name: AUTH0_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: chessapp-auth0-client-id
                  key: latest
            - name: AUTH0_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: chessapp-auth0-client-secret
                  key: latest
            - name: AUTH0_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: chessapp-auth0-audience
                  key: latest
            - name: LOCAL_AUTH_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: chessapp-auth0-secret
                  key: latest
